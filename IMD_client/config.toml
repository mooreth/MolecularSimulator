# Molecular Simulator application settings.
# File paths are relative to this config.toml file.

[files]
data_file = "../gripper_block_pickup.data"
group_file = "../samson_groups.in"
simulation_file = "../simulation.in"

[network]
samson_host = "0.0.0.0"
imd_host = "127.0.0.1"
imd_port = 5678
samson_port = 5679

[simulation]
# Number of LAMMPS MD steps advanced during each Python control-loop cycle.
# This is NOT the molecular dynamics timestep.
steps_per_update = 10

[lammps]
# Must match the atom style declared in the LAMMPS data file.
atom_style = "molecular"

[imd]
# Send one coordinate update every N LAMMPS steps.
transfer_rate = 10

[controls]
quit_key = "q"

# Each motor needs its own SAMSON structural group and LAMMPS group.
# Motor 1: J = +axis, K = stop, L = -axis. Example axis is +X.
[motors.motor1]
group = "motor1"
fix_id = "motor1_move"
velocity = 10.0
axis = [1.0, 0.0, 0.0]
forward_key = "j"
stop_key = "k"
reverse_key = "l"

# Motor 2: F = +axis, G = stop, H = -axis. Example axis is +Y.
# Create a SAMSON group named motor2 before enabling this entry.
[motors.motor2]
group = "motor2"
fix_id = "motor2_move"
velocity = 10.0
axis = [0.0, 1.0, 0.0]
forward_key = "f"
stop_key = "g"
reverse_key = "h"

[samson]
display_interval_ms = 16

[elements.overrides]
# Optional explicit element assignments by LAMMPS atom type.
# Example:
# "1" = "C"
# "2" = "H"
# If omitted, the application infers elements from the Masses section.

[export]
# Padding added around the current SAMSON coordinates when rebuilding the LAMMPS box.
box_padding = 10.0


# Optional third motor: force-driven actuator.
# Uncomment this section after creating/exporting a SAMSON structural group
# named motor3. P = apply force along +axis, O = remove the applied force,
# I = apply force along -axis.
#
# Force is the TOTAL force applied to the entire group, in nanonewtons (nN).
# The controller distributes this force evenly across the group's atoms.
# Do not enter a per-atom force.
#
# In LAMMPS units metal, 1 nN = 0.6242 eV/Angstrom.
[motors.motor3]
group = "motor3"
fix_id = "motor3_push"
motion = "force"
force = 0.1
force_units = "nN"
axis = [0.0, 1.0, 0.0]
forward_key = "p"
stop_key = "o"
reverse_key = "i"
